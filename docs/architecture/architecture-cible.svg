<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
<title id="title">Architecture cible OpenContentAI et état d'avancement</title>
<desc id="desc">Un moteur de production partagé pour trois profils éditoriaux publiés sur YouTube et TikTok, orchestré localement par n8n sous Windows 11, WSL2 et Docker. Telegram sert à la validation humaine. Les moteurs IA et les intégrations de publication restent à intégrer.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9fc"/><stop offset="1" stop-color="#edf3fa"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9f2ff"/><stop offset="1" stop-color="#dceaff"/></linearGradient>
  <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e7f8f4"/><stop offset="1" stop-color="#d4f0e8"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#19324d" flood-opacity=".10"/></filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#66809b"/></marker>
  <style>
    .h1{font:700 36px 'Segoe UI',Arial,sans-serif;fill:#142b45}.sub{font:400 18px 'Segoe UI',Arial,sans-serif;fill:#536a82}
    .section{font:700 20px 'Segoe UI',Arial,sans-serif;fill:#24415f;letter-spacing:.4px}
    .title{font:700 21px 'Segoe UI',Arial,sans-serif;fill:#18334f}.body{font:400 16px 'Segoe UI',Arial,sans-serif;fill:#425a72}.small{font:400 14px 'Segoe UI',Arial,sans-serif;fill:#526a80}
    .badge{font:700 13px 'Segoe UI',Arial,sans-serif}.pill{font:600 13px 'Segoe UI',Arial,sans-serif}
    .card{stroke:#cad6e3;stroke-width:1.5;rx:18;filter:url(#shadow)}
    .line{stroke:#7890a8;stroke-width:3;fill:none;marker-end:url(#arrow)}
    .lineDash{stroke:#94a8bd;stroke-width:2.5;stroke-dasharray:9 8;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1600" height="1120" fill="url(#bg)"/>
<text x="70" y="72" class="h1">OpenContentAI — Architecture cible</text>
<text x="70" y="108" class="sub">Un moteur commun · trois profils éditoriaux · deux plateformes · validation humaine obligatoire</text>

<!-- status strip -->
<rect x="70" y="132" width="1460" height="92" rx="18" fill="#ffffff" stroke="#d7e1eb" filter="url(#shadow)"/>
<text x="95" y="166" class="section">ÉTAT AU 18 NOVEMBRE 2026</text>
<rect x="95" y="181" width="215" height="27" rx="13" fill="#dff4e8"/><text x="202" y="200" text-anchor="middle" class="badge" fill="#17683d">Docker / WSL2 vérifiés</text>
<rect x="325" y="181" width="310" height="27" rx="13" fill="#dff4e8"/><text x="480" y="200" text-anchor="middle" class="badge" fill="#17683d">Telegram : test d'écho réussi le 28/09/2026</text>
<rect x="650" y="181" width="230" height="27" rx="13" fill="#fff1d8"/><text x="765" y="200" text-anchor="middle" class="badge" fill="#8a5700">Limites WSL2 à finaliser</text>
<rect x="895" y="181" width="255" height="27" rx="13" fill="#e8edf4"/><text x="1022" y="200" text-anchor="middle" class="badge" fill="#52677d">Moteurs médias à intégrer</text>
<rect x="1165" y="181" width="335" height="27" rx="13" fill="#e8edf4"/><text x="1332" y="200" text-anchor="middle" class="badge" fill="#52677d">Publication YouTube / TikTok à intégrer</text>

<!-- profile group -->
<text x="70" y="273" class="section">1. PROFILS ÉDITORIAUX</text>
<rect x="70" y="292" width="1460" height="150" rx="20" fill="#ffffff" stroke="#d7e1eb"/>
<rect x="100" y="316" width="420" height="98" rx="15" fill="url(#blue)" stroke="#9bbbe4" stroke-width="1.5"/>
<text x="130" y="351" class="title">TECH</text><text x="130" y="380" class="body">Réseaux · cybersécurité · cloud · Linux · IA</text>
<rect x="590" y="316" width="420" height="98" rx="15" fill="#fff1e6" stroke="#e7bd9b" stroke-width="1.5"/>
<text x="620" y="351" class="title">SPORT</text><text x="620" y="380" class="body">Football · sport · récits · statistiques · analyses originales</text>
<rect x="1080" y="316" width="420" height="98" rx="15" fill="#f2ebff" stroke="#c6b3e5" stroke-width="1.5"/>
<text x="1110" y="351" class="title">STORIES</text><text x="1110" y="380" class="body">Fictions · histoires réelles · mystères · faits insolites</text>

<!-- arrows profiles -> orchestrator -->
<path d="M310 442 V480 H800 V510" class="line"/>
<path d="M800 442 V510" class="line"/>
<path d="M1290 442 V480 H800" class="line"/>

<!-- local environment outer -->
<rect x="70" y="510" width="1040" height="485" rx="24" fill="#ffffff" stroke="#9eb4ca" stroke-width="2" filter="url(#shadow)"/>
<text x="100" y="548" class="section">2. ENVIRONNEMENT LOCAL — WINDOWS 11 PRO</text>
<rect x="100" y="567" width="980" height="390" rx="18" fill="#f7faff" stroke="#c4d3e2" stroke-width="1.5"/>
<rect x="125" y="590" width="930" height="58" rx="12" fill="#e9eef5" stroke="#c3d0dd"/>
<text x="150" y="626" class="title">WSL2 + Docker Desktop</text>
<text x="1025" y="626" text-anchor="end" class="pill" fill="#17683d">BASE VALIDÉE</text>

<!-- n8n -->
<rect x="130" y="680" width="280" height="220" rx="16" fill="url(#blue)" stroke="#8fb1da" stroke-width="1.5"/>
<text x="158" y="718" class="title">n8n — Orchestration</text>
<text x="158" y="752" class="body">• Déclencheurs et planification</text>
<text x="158" y="780" class="body">• Enchaînement des étapes</text>
<text x="158" y="808" class="body">• États et gestion d'erreurs</text>
<text x="158" y="836" class="body">• Appels aux services</text>
<rect x="158" y="858" width="220" height="25" rx="12" fill="#fff1d8"/><text x="268" y="876" text-anchor="middle" class="badge" fill="#8a5700">Redéploiement V1 à faire</text>

<!-- content engine -->
<rect x="445" y="680" width="300" height="220" rx="16" fill="#f0f7ff" stroke="#a6bdd5" stroke-width="1.5"/>
<text x="473" y="718" class="title">Moteur de contenu</text>
<text x="473" y="752" class="body">• Scripts et sources</text>
<text x="473" y="780" class="body">• Découpage en scènes</text>
<text x="473" y="808" class="body">• Métadonnées et profils</text>
<text x="473" y="836" class="body">• Contrôle qualité (QA)</text>
<rect x="473" y="858" width="245" height="25" rx="12" fill="#e8edf4"/><text x="595" y="876" text-anchor="middle" class="badge" fill="#52677d">Architecture prévue</text>

<!-- media adapters -->
<rect x="780" y="680" width="275" height="220" rx="16" fill="url(#teal)" stroke="#8fc7b7" stroke-width="1.5"/>
<text x="808" y="718" class="title">Adaptateurs médias</text>
<text x="808" y="752" class="body">• LLM / génération de scripts</text>
<text x="808" y="780" class="body">• TTS / narration</text>
<text x="808" y="808" class="body">• Visuels / vidéo</text>
<text x="808" y="836" class="body">• FFmpeg / sous-titres / QA</text>
<rect x="808" y="858" width="218" height="25" rx="12" fill="#e8edf4"/><text x="917" y="876" text-anchor="middle" class="badge" fill="#52677d">À intégrer au fil de l'eau</text>

<path d="M410 790 H445" class="line"/><path d="M745 790 H780" class="line"/>
<text x="130" y="932" class="small">Données locales : scripts, sources, projets, médias temporaires, exports et journaux.</text>
<text x="130" y="954" class="small">Les fichiers volumineux et modèles restent hors du dépôt Git.</text>

<!-- telegram approval -->
<rect x="1160" y="510" width="370" height="205" rx="20" fill="#ffffff" stroke="#8fc7b7" stroke-width="2" filter="url(#shadow)"/>
<text x="1190" y="550" class="section">3. VALIDATION HUMAINE</text>
<rect x="1190" y="575" width="310" height="100" rx="14" fill="url(#teal)" stroke="#8fc7b7"/>
<text x="1215" y="610" class="title">Telegram Bot</text>
<text x="1215" y="638" class="body">Notification · aperçu · approbation</text>
<text x="1215" y="660" class="small">Connexion et réponse d'écho testées le 28/09/2026</text>
<path d="M1110 610 H1160" class="lineDash"/>

<!-- publish targets -->
<rect x="1160" y="760" width="370" height="235" rx="20" fill="#ffffff" stroke="#c5d1de" stroke-width="2" filter="url(#shadow)"/>
<text x="1190" y="800" class="section">4. DESTINATIONS</text>
<rect x="1190" y="822" width="310" height="62" rx="13" fill="#f2f6fb" stroke="#bdcbd9"/>
<text x="1215" y="860" class="title">YouTube</text><text x="1470" y="860" text-anchor="end" class="pill" fill="#657b91">À intégrer</text>
<rect x="1190" y="900" width="310" height="62" rx="13" fill="#f2f6fb" stroke="#bdcbd9"/>
<text x="1215" y="938" class="title">TikTok</text><text x="1470" y="938" text-anchor="end" class="pill" fill="#657b91">À intégrer</text>
<path d="M1345 715 V760" class="lineDash"/>
<text x="70" y="1050" class="small">Légende : vert = testé ou vérifié · orange = étape actuelle / à finaliser · gris = composant prévu, non encore validé.</text>
<text x="70" y="1082" class="small">Important : le schéma décrit l'architecture cible. Il ne signifie pas que toute la chaîne de génération ou de publication est déjà opérationnelle.</text>
</svg>